name: Mirror live site

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Fetch live site
        run: |
          rm -rf static
          mkdir -p static
          wget --recursive --level=2 --convert-links --adjust-extension \
            --page-requisites --no-parent \
            --domains=jays.services,jaywedgeworth.grok.me \
            --directory-prefix=tmp-mirror \
            -e robots=off \
            https://jays.services/ || true
          if [ -d tmp-mirror/jays.services ]; then
            cp -r tmp-mirror/jays.services/* static/ || true
          fi
          rm -rf tmp-mirror
          
          # Restore updated app icons from git so they aren't overwritten by outdated live site assets
          git checkout HEAD -- static/app-icons/

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update static mirror of live site $(date -u +%Y-%m-%d)"
            git push
          fi
