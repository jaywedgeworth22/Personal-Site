name: Backup GitHub Repos to Google Drive

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Personal-Site
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
        run: gh auth status

      - name: Create backup directory
        run: mkdir -p backups

      - name: Export Usage-Monitor as zip
        env:
          GH_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
        run: |
          gh repo clone jaywedgeworth22/Usage-Monitor backups/Usage-Monitor
          cd backups/Usage-Monitor && zip -r ../Usage-Monitor.zip . && cd ../.. && rm -rf backups/Usage-Monitor

      - name: Export ai-fleet-coordinator as zip
        env:
          GH_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
        run: |
          gh repo clone jaywedgeworth22/ai-fleet-coordinator backups/ai-fleet-coordinator
          cd backups/ai-fleet-coordinator && zip -r ../ai-fleet-coordinator.zip . && cd ../.. && rm -rf backups/ai-fleet-coordinator

      - name: Export Congress.Trade as zip
        env:
          GH_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
        run: |
          gh repo clone jaywedgeworth22/Congress.Trade backups/Congress.Trade
          cd backups/Congress.Trade && zip -r ../Congress.Trade.zip . && cd ../.. && rm -rf backups/Congress.Trade

      - name: Export congresstrade.grok.me as zip
        env:
          GH_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
        run: |
          gh repo clone jaywedgeworth22/congresstrade.grok.me backups/congresstrade.grok.me || echo "Repo not found or private - skipping"
          if [ -d "backups/congresstrade.grok.me" ]; then
            cd backups/congresstrade.grok.me && zip -r ../congresstrade.grok.me.zip . && cd ../.. && rm -rf backups/congresstrade.grok.me
          fi

      - name: List created backups
        run: ls -la backups/

      # Note: Google Drive upload would require additional setup or a Drive upload action
      # For now, the zips are available as artifacts and can be downloaded
      - name: Upload backup zips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-backups
          path: backups/*.zip
          retention-days: 90
