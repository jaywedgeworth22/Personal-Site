name: Backup GitHub Repositories

# Fleet-wide GitHub artifact backup and Google Drive backup moved to
# jaywedgeworth22/ai-fleet-coordinator:
#   - Drive (canonical): Mac launchd com.jay.fleet-gdrive-backup
#     scripts/backup-fleet-to-gdrive.py
#   - GitHub artifacts (90 days): .github/workflows/backup-repos.yml there
#
# This workflow used to clone a hardcoded repo list with GH_BACKUP_TOKEN.
# That secret was never set, so GH_TOKEN was empty and every scheduled run
# since 2026-08-13 failed.  Keep workflow_dispatch so old Action URLs still
# resolve; do not schedule it.

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Point at the coordinator backup
        run: |
          echo "Drive backup: Mac job com.jay.fleet-gdrive-backup"
          echo "GitHub artifact backup: jaywedgeworth22/ai-fleet-coordinator .github/workflows/backup-repos.yml"
